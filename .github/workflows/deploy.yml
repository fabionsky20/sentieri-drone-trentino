# Build della web app a ogni push su main; deploy su GitHub Pages solo se la
# variabile di repository DEPLOY_PAGES vale "true" (Settings → Secrets and variables
# → Actions → Variables). I dati arrivano già pronti da data/processed/ (versionati).
# Ogni giorno (e a ogni push) si aggiornano anche gli avvisi di chiusura dei sentieri
# (pipeline/avvisi.py: comunicati della Provincia e notizie): non sono versionati, finiscono
# solo nel sito pubblicato. Se le fonti non rispondono la build va avanti lo stesso.
name: Build e deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # ogni mattina, ~5:17 ora italiana
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Avvisi già letti nei giorni scorsi (così si tengono anche quelli più vecchi della finestra).
      - uses: actions/cache@v4
        with:
          path: data/raw/avvisi
          key: avvisi-${{ github.run_id }}
          restore-keys: avvisi-
      - name: Avvisi di chiusura (Provincia, notizie)
        run: python3 -m pipeline.avvisi
        continue-on-error: true
        timeout-minutes: 15
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
