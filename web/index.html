<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B6E84" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B6E84'/%3E%3Cpath d='M5 24 13 11l4.5 7 3-4.5L27 24z' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <title>Quota 120</title>
    <meta name="description" content="Quota 120: dove volare con il drone sui sentieri del Trentino, zone D-Flight, meteo e amici." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-180.png" />
    <meta name="apple-mobile-web-app-title" content="Quota 120" />
  </head>
  <body>
    <!-- Barra superiore: su PC è l'header; su telefono galleggia sopra la mappa (ricerca + chip). -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark"><i data-icon="drone" data-size="20"></i></span>
        <span class="brand-name">Quota <span>120</span></span>
      </div>

      <div class="searchwrap">
        <label class="searchbar">
          <i data-icon="search" data-size="20"></i>
          <input type="search" id="search-input" placeholder="Sentiero, vetta, lago, rifugio, passo…" autocomplete="off" enterkeyhint="search" aria-label="Cerca" />
        </label>
        <button type="button" id="open-filters" class="squarebtn mobile-only" aria-label="Filtri">
          <i data-icon="filter"></i>
          <span id="filter-count" class="count mono" hidden></span>
        </button>
        <ul id="search-results" class="search-results" hidden></ul>
      </div>

      <div class="chips">
        <label class="chip datechip" title="Data del volo: applica NOTAM e chiusure">
          <i data-icon="calendar" data-size="16"></i>
          <span class="chip-k">VOLO</span>
          <span id="day-label" class="mono"></span>
          <input type="date" id="day" required aria-label="Data del volo" />
        </label>
        <button type="button" id="notam-chip" class="chip notamchip" hidden title="Mostra le zone D-Flight">
          <i class="dot rosso"></i><span id="notam-label" class="mono"></span>
        </button>
      </div>

      <div class="topactions desktop-only">
        <button type="button" id="toggle-zones" class="btn-outline" aria-pressed="false">
          <i data-icon="shield" data-size="18"></i><span>ZONE</span>
        </button>
        <button type="button" id="open-saved" class="btn-outline" aria-pressed="false">
          <i data-icon="bookmark" data-size="18"></i><span>SALVATI</span>
        </button>
        <button type="button" id="open-notifs" class="iconbtn bellbtn" aria-pressed="false" aria-label="Notifiche" title="Notifiche" hidden>
          <i data-icon="bell"></i><span id="notif-count" class="count mono" hidden></span>
        </button>
        <button type="button" id="open-profile" class="avatarbtn" aria-pressed="false" aria-label="Profilo" title="Profilo">
          <span id="header-avatar" class="avatar-slot"><i data-icon="user" data-size="22"></i></span>
          <i id="header-alert" class="alert-dot" hidden></i>
        </button>
      </div>
    </header>

    <main class="layout">
      <!-- Pannello sinistro (≥768) = scoprire: filtri, e sopra di essi la scheda di sentiero/POI/zona.
           Telefono: schermate intere (tutte le viste, anche quelle del pannello destro). -->
      <aside id="side" class="side" data-view="filters">
        <section id="filters-view" class="view">
          <div class="view-head">
            <h2>Filtri</h2>
            <button type="button" id="filters-reset" class="btn-text">AZZERA</button>
            <button type="button" id="filters-close" class="iconbtn mobile-only" aria-label="Chiudi filtri"><i data-icon="close"></i></button>
          </div>
          <div class="view-body">
            <div id="filters-form"></div>
            <div id="poi-section"></div>
            <div class="results-block">
              <p id="filters-summary" class="section-label"></p>
              <ul id="filters-results" class="cards"></ul>
            </div>
          </div>
          <div class="view-foot mobile-only">
            <button type="button" id="show-results" class="btn-primary wide"></button>
          </div>
        </section>

        <section id="results-view" class="view mobile-only" hidden>
          <div class="view-head">
            <button type="button" id="results-back" class="iconbtn" aria-label="Torna ai filtri"><i data-icon="back"></i></button>
            <h2 id="results-title">Risultati</h2>
            <button type="button" id="results-map" class="btn-text">MAPPA</button>
          </div>
          <div class="view-body"><ul id="results-list" class="cards"></ul></div>
        </section>

        <section id="profile-view" class="view" hidden>
          <div class="view-head">
            <h2>Profilo</h2>
            <button type="button" id="profile-notifs" class="iconbtn bellbtn mobile-only" aria-label="Notifiche"><i data-icon="bell"></i><span id="profile-notif-count" class="count mono" hidden></span></button>
            <button type="button" id="profile-close" class="iconbtn" aria-label="Chiudi profilo"><i data-icon="close"></i></button>
          </div>
          <div class="view-body" id="profile-body"></div>
        </section>

        <section id="notifs-view" class="view" hidden>
          <div class="view-head">
            <h2>Notifiche</h2>
            <button type="button" id="notifs-close" class="iconbtn" aria-label="Chiudi notifiche"><i data-icon="close"></i></button>
          </div>
          <div class="view-body" id="notifs-body"></div>
        </section>

        <section id="board-view" class="view" hidden>
          <div class="view-head">
            <button type="button" id="board-back" class="iconbtn" aria-label="Torna alle bacheche"><i data-icon="back"></i></button>
            <h2 id="board-title">Bacheca</h2>
            <button type="button" id="board-close" class="iconbtn desktop-only" aria-label="Chiudi bacheca"><i data-icon="close"></i></button>
          </div>
          <div class="view-body" id="board-body"></div>
        </section>

        <section id="saved-view" class="view" hidden>
          <div class="view-head">
            <h2>Salvati</h2>
            <button type="button" id="saved-close" class="iconbtn" aria-label="Chiudi salvati"><i data-icon="close"></i></button>
          </div>
          <div class="view-body" id="saved-body"></div>
        </section>
        <div id="left-resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="Larghezza del pannello sinistro" title="Trascina per ridimensionare · doppio clic: larghezza predefinita"></div>
      </aside>

      <div class="mapwrap">
        <div id="map" aria-label="Mappa dei sentieri"></div>

        <!-- ≥768: linguetta per comprimere/riaprire il pannello sinistro -->
        <button type="button" id="left-tab" class="edgetab" aria-label="Mostra i filtri" title="Mostra i filtri"><i data-icon="chevronRight" data-size="20"></i></button>

        <div class="maptools">
          <button type="button" id="basemap-btn" class="toolbtn" aria-pressed="false" title="Sfondo: pulita / topografica">
            <i data-icon="layers"></i><span class="tool-k mono" id="basemap-label">PUL</span>
          </button>
          <button type="button" id="zones-btn" class="toolbtn" aria-pressed="false" title="Zone D-Flight"><i data-icon="shield"></i></button>
          <button type="button" id="locate-btn" class="toolbtn" aria-pressed="false" title="La mia posizione"><i data-icon="locate"></i></button>
          <button type="button" id="zoomin-btn" class="toolbtn desktop-only" title="Avvicina"><i data-icon="plus"></i></button>
          <button type="button" id="zoomout-btn" class="toolbtn desktop-only" title="Allontana"><i data-icon="minus"></i></button>
        </div>

        <div id="legend" class="legend">
          <ul class="legend-lines">
            <li><i class="ln verde"></i>Libero 120 m</li>
            <li><i class="ln giallo"></i>Quota limitata</li>
            <li><i class="ln rosso"></i>No / autorizz.</li>
          </ul>
          <p class="legend-meta mono"><span id="trail-count"></span> · <span id="snapshot"></span></p>
        </div>

        <!-- Scheda: bottom sheet su telefono; su ≥768 main.ts la sposta nel pannello sinistro, sopra i filtri. -->
        <aside id="sheet" class="sheet" hidden>
          <div class="sheet-top">
            <button type="button" id="sheet-handle" class="handle" aria-label="Espandi o riduci la scheda"></button>
            <button type="button" id="sheet-filters" class="btn-text sheet-back desktop-only"><i data-icon="back" data-size="18"></i>FILTRI</button>
            <button type="button" id="panel-close" class="iconbtn" aria-label="Chiudi"><i data-icon="close"></i></button>
          </div>
          <div id="panel-body" class="sheet-body"></div>
          <div id="panel-foot" class="sheet-foot" hidden></div>
        </aside>
      </div>

      <!-- Pannello destro (≥768) = le mie cose: salvati, bacheche, profilo, notifiche (spostati qui da main.ts). -->
      <aside id="mine" class="mine">
        <div id="right-resizer" class="resizer" role="separator" aria-orientation="vertical" aria-label="Larghezza del pannello destro" title="Trascina per ridimensionare · doppio clic: larghezza predefinita"></div>
      </aside>
    </main>

    <nav class="tabbar mobile-only" aria-label="Sezioni">
      <button type="button" class="tab" data-tab="map" aria-current="page"><i data-icon="map"></i><span>MAPPA</span></button>
      <button type="button" class="tab" data-tab="filters"><i data-icon="filter"></i><span>FILTRI</span><span id="tab-count" class="count mono" hidden></span></button>
      <button type="button" class="tab" data-tab="saved"><i data-icon="bookmark"></i><span>SALVATI</span></button>
      <button type="button" class="tab" data-tab="profile">
        <span id="tab-avatar" class="avatar-slot"><i data-icon="user"></i></span><span>PROFILO</span>
        <i id="tab-alert" class="alert-dot" hidden></i>
        <span id="tab-notif-count" class="count mono" hidden></span>
      </button>
    </nav>

    <!-- Primo accesso: tre schermate saltabili (nome, zona, droni) -->
    <div id="onboarding" class="overlay" hidden></div>

    <!-- Finestre: scelta della bacheca, invito via link -->
    <div id="modal" class="overlay" hidden></div>

    <div id="status" class="toast">Caricamento dati…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
