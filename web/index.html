<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1f3a2e" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a2e'/%3E%3Cpath d='M4 25 13 10l5 8 3-4 7 11z' fill='%23fff'/%3E%3Cpath d='M4 25 13 10l3 5' stroke='%231f9d55' stroke-width='2.5' fill='none'/%3E%3C/svg%3E"
    />
    <title>Sentieri &amp; Drone</title>
  </head>
  <body>
    <header class="bar">
      <span class="brand">Sentieri &amp; Drone</span>
      <button type="button" id="open-search" class="iconbtn" aria-label="Cerca" title="Cerca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" /><path d="m15.5 15.5 5 5" /></svg>
      </button>
      <button type="button" id="open-filters" class="iconbtn" aria-label="Filtri" title="Filtri">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4 2v-8z" /></svg>
        <span id="filter-count" class="count" hidden></span>
      </button>
      <label class="day">
        <span>Volo il</span>
        <input type="date" id="day" required />
      </label>
      <button type="button" id="toggle-zones" class="toggle" aria-pressed="false">Zone</button>
    </header>

    <div id="map" aria-label="Mappa dei sentieri"></div>

    <details id="legend" open>
      <summary>Legenda</summary>
      <ul>
        <li><i class="sw verde"></i>Volo libero (max 120 m)</li>
        <li><i class="sw giallo"></i>Libero fino alla quota indicata</li>
        <li><i class="sw rosso"></i>Vietato o con autorizzazione</li>
      </ul>
      <p class="legend-title">Punti sulla mappa</p>
      <div id="poi-toggles" class="poi-toggles"></div>
      <p id="snapshot" class="snapshot"></p>
    </details>

    <div id="search" class="search" hidden>
      <div class="search-box">
        <input type="search" id="search-input" placeholder="Sentiero, vetta, lago, rifugio, passo, paese…" autocomplete="off" />
        <button type="button" id="search-close" class="close" aria-label="Chiudi ricerca">×</button>
      </div>
      <ul id="search-results" class="search-results"></ul>
    </div>

    <aside id="filters" class="filters" hidden>
      <div class="filters-head">
        <h2>Filtri</h2>
        <button type="button" id="filters-reset" class="link">Azzera</button>
        <button type="button" id="filters-close" class="close" aria-label="Chiudi filtri">×</button>
      </div>
      <div id="filters-form"></div>
      <p id="filters-summary" class="filters-summary"></p>
      <ul id="filters-results" class="results"></ul>
    </aside>

    <aside id="panel" hidden>
      <button type="button" class="close" id="panel-close" aria-label="Chiudi">×</button>
      <div id="panel-body"></div>
    </aside>

    <div id="status" class="status">Caricamento dati…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
